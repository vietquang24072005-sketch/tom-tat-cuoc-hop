<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Nút nổi</title>
  <link rel="stylesheet" href="bubble.css" />
</head>
<body>
  <div id="bar" class="bar">
    <button id="orb" class="orb" title="Bấm: mở menu · Kéo: di chuyển · Chuột phải: tuỳ chọn">
      <svg class="i-logo" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 10v4M9 7v10M13 4v16M17 8v8M21 11v2"/></g></svg>
      <svg class="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="i-spin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-dasharray="34 50" stroke-linecap="round"/></svg>
      <svg class="i-ok" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="i-err" viewBox="0 0 24 24"><path d="M12 7v6M12 16.5v.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>
      <span class="badge" title="Đang ghi cuộc họp"></span>
    </button>
    <div class="actions">
      <button id="aDict" class="act" title="Gõ bằng giọng nói (Ctrl+Shift+Space)">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button id="aMeet" class="act" title="Ghi cuộc họp">
        <svg class="i-rec" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>
        <svg class="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor"/></svg>
        <span id="meetTime" class="time"></span>
      </button>
      <button id="aOpen" class="act" title="Mở cửa sổ biên bản">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 9h17" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
  </div>
  <script src="audio-utils.js"></script>
  <script src="bubble.js"></script>
</body>
</html>
